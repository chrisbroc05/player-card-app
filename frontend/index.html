<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prospect Legends — Digital Collectible Cards</title>
    <meta
      name="description"
      content="Prospect Legends — create, collect, and trade premium digital baseball cards. Build your roster in the Card Studio."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Prospect Legends" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@700;800&family=Oswald:wght@400;600;700&family=Russo+One&family=Cinzel:wght@400;600;700&family=Rajdhani:wght@500;600;700&family=Dancing+Script:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="background:#0A0A0A;margin:0">
    <div id="splash-screen" style="
  position: fixed;
  inset: 0;
  background: #0A0A0A;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 0.5s ease;
">
  <img 
    src="/prospect-legends-logo.png"
    alt="Prospect Legends"
    id="splash-logo"
    style="
      width: 100px;
      height: 100px;
      object-fit: contain;
      animation: splashPulse 1.5s ease-in-out infinite;
    "
  />
  <div style="
    margin-top: 24px;
    font-family: 'Barlow Condensed', 
      system-ui, sans-serif;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    background: linear-gradient(
      135deg, #C9A84C, #E8C56A, #A8832A
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  ">
    Prospect Legends
  </div>
  <div style="
    margin-top: 8px;
    font-family: system-ui, sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #555555;
  ">
    Digital Collectible Cards
  </div>

  <div style="
    position: absolute;
    bottom: 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  ">
    <div id="splash-loader" style="
      width: 40px;
      height: 3px;
      background: rgba(201,168,76,0.2);
      border-radius: 2px;
      overflow: hidden;
    ">
      <div style="
        height: 100%;
        background: linear-gradient(
          90deg, #C9A84C, #E8C56A
        );
        border-radius: 2px;
        animation: splashLoad 1.5s ease-in-out infinite;
      "></div>
    </div>
  </div>
</div>

<style>
  @keyframes splashPulse {
    0%, 100% { 
      transform: scale(1); 
      opacity: 1; 
    }
    50% { 
      transform: scale(1.05); 
      opacity: 0.9; 
    }
  }

  @keyframes splashLoad {
    0% { 
      width: 0%; 
      margin-left: 0; 
    }
    50% { 
      width: 100%; 
      margin-left: 0; 
    }
    100% { 
      width: 0%; 
      margin-left: 100%; 
    }
  }

  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&display=swap');
</style>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
  </html>
