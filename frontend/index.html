<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prospect Legends — Digital Collectible Cards</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color for browser chrome -->
    <meta name="theme-color" content="#C9A84C" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Prospect Legends" />

    <!-- iOS icons -->
    <link rel="apple-touch-icon" href="/icons/icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167x167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png" />

    <!-- Standard favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96x96.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-72x72.png" />

    <!-- App description for SEO -->
    <meta
      name="description"
      content="Create AI-powered youth baseball digital trading cards. Collect, trade, and sell on the marketplace."
    />
    <meta
      name="keywords"
      content="baseball cards, youth sports, trading cards, AI cards, prospect legends"
    />

    <!-- Open Graph for link sharing -->
    <meta property="og:title" content="Prospect Legends" />
    <meta property="og:description" content="Youth baseball digital trading cards" />
    <meta property="og:image" content="/icons/icon-512x512.png" />
    <meta property="og:type" content="website" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Prospect Legends" />
    <meta name="twitter:description" content="Youth baseball digital trading cards" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@700;800&family=Oswald:wght@400;600;700&family=Russo+One&family=Cinzel:wght@400;600;700&family=Rajdhani:wght@500;600;700&family=Dancing+Script:wght@600;700&display=swap"
      rel="stylesheet"
    />
