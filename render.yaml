# Render Blueprint — applies when this repo is linked as a Blueprint for the service.
# If your static site was created manually, add the same rewrite in the dashboard (see below).
#
# Dashboard (fastest fix, no Blueprint required):
#   Static Site → Redirects/Rewrites → Add rule:
#   - Type: Rewrite
#   - Source: /*
#   - Destination: /index.html
#   https://render.com/docs/redirects-rewrites
#
services:
  - type: web
    name: player-card-app
    runtime: static
    repo: https://github.com/chrisbroc05/player-card-app.git
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
