# Render Blueprint — applies when this repo is linked as a Blueprint for the service.
# If your static site was created manually, add the same rewrite in the dashboard (see below).
#
# Dashboard — SPA fallback (React Router):
#   Add ONE rewrite rule (not Redirect):
#   - Source: /*
#   - Destination: /index.html   <-- must start with / and be the URL path only
#
#   Do NOT set destination to a filesystem path (e.g. dist/index.html or
#   frontend/dist/index.html). That produces HTTP 200 with an empty body
#   (white screen). See: https://community.render.com/t/not-able-to-locate-index-html-in-rewrite-rule/13358
#
#   https://render.com/docs/redirects-rewrites
#
services:
  - type: web
    name: player-card-app
    runtime: static
    repo: https://github.com/chrisbroc05/player-card-app.git
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
