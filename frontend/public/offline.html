<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" 
    content="width=device-width, 
    initial-scale=1.0" />
  <title>Prospect Legends — Offline</title>
  <style>
    * { margin: 0; padding: 0; 
        box-sizing: border-box; }
    
    body {
      background: #0A0A0A;
      color: #FFFFFF;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 24px;
      border-radius: 16px;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(
        135deg, #C9A84C, #E8C56A, #A8832A
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
      font-family: 'Barlow Condensed', 
        system-ui, sans-serif;
    }

    p {
      font-size: 15px;
      color: #888888;
      line-height: 1.6;
      max-width: 280px;
      margin-bottom: 32px;
    }

    .retry-btn {
      background: linear-gradient(
        135deg, #C9A84C, #E8C56A
      );
      color: #0A0A0A;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Barlow Condensed', 
        system-ui, sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .status {
      margin-top: 20px;
      font-size: 12px;
      color: #555555;
    }
  </style>
  <link 
    rel="preconnect" 
    href="https://fonts.googleapis.com" />
  <link 
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&display=swap" 
    rel="stylesheet" />
</head>
<body>
  <img 
    src="/prospect-legends-logo.png" 
    alt="Prospect Legends"
    class="logo"
    onerror="this.style.display='none'"
  />
  <h1>Prospect Legends</h1>
  <p>
    You appear to be offline. 
    Reconnect to the internet to 
    continue creating and trading cards.
  </p>
  <button 
    class="retry-btn"
    onclick="window.location.reload()"
  >
    Try Again
  </button>
  <p class="status" id="status"></p>

  <script>
    // Auto retry when connection restored
    window.addEventListener('online', () => {
      document.getElementById('status')
        .textContent = 'Connection restored — reloading...'
      setTimeout(() => {
        window.location.reload()
      }, 1000)
    })

    // Show connection status
    window.addEventListener('offline', () => {
      document.getElementById('status')
        .textContent = 'Still offline...'
    })
  </script>
</body>
</html>
